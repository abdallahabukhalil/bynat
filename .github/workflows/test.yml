name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check bynat tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tooling
        run: python -m pip install . pytest build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Compile package
        run: python -m compileall -q bynat

      - name: Run tests
        run: python -m pytest -q

  test-extras:
    # Light, offline-capable extras; network-backed integrations are covered by fakes.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with extras
        run: python -m pip install ".[categorization,sql]" pytest

      - name: Run tests
        run: python -m pytest -q -rs
