[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bynat"
version = "0.1.1"
description = "A collection of reusable Python utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Babel",
    "Caching",
    "deep-translator",
    "geopy",
    "langdetect",
    "numpy",
    "pandas",
    "pyahocorasick",
    "pycountry",
    "spacy",
    "SQLAlchemy",
    "yfinance",
]
license = "MIT"
authors = [
    { name = "Abdallah Abukhalil" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
include = ["bynat*"]
