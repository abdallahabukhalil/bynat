[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bynat"
version = "0.1.1"
description = "A collection of reusable Python utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
]
license = "MIT"
authors = [
    { name = "Abdallah Abukhalil" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
translation = [
    "deep-translator",
    "langdetect",
]
geocoding = [
    "geopy",
]
currency = [
    "Babel",
    "pycountry",
    "yfinance",
]
categorization = [
    "pyahocorasick",
]
nlp = [
    "spacy",
]
sql = [
    "SQLAlchemy",
]

[tool.setuptools.packages.find]
include = ["bynat*"]
